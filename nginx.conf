server {
    listen 80;
    server_name zework.com www.zework.com;
    root /var/www/website-zework;
    index index.html;

    # Redirect www → non-www
    if ($host = www.zework.com) {
        return 301 https://zework.com$request_uri;
    }

    # ==============================
    # Clean URL → HTML file mapping
    # ==============================
    location = /tinh-nang    { try_files /pageFeature.html =404; }
    location = /bang-gia     { try_files /pagePrice.html =404; }
    location = /bai-viet     { try_files /pageArticle.html =404; }
    location = /lien-he      { try_files /pageContact.html =404; }
    location = /chinh-sach-bao-mat { try_files /policy.html =404; }
    location = /bao-mat            { try_files /policy.html =404; }
    location = /dieu-khoan-dich-vu { try_files /terms.html =404; }
    location = /ve-zework    { try_files /company.html =404; }

    # ==============================
    # Static assets caching
    # ==============================
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ==============================
    # Fallback cho tất cả route còn lại
    # ==============================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
